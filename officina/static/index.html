<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Officina</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>

  :root {

    --sfondo: #12161d; --pannello: #1a2029; --bordo: #2a3340;

    --testo: #e4e8ee; --tenue: #8d98a8;

    --ok: #5fd3b8; --errore: #ff8a8a; --suggerimento: #f2c46d;

    --ui: "Atkinson Hyperlegible", system-ui, sans-serif;

    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body { background: var(--sfondo); color: var(--testo); font-family: var(--ui); display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--bordo); }

  header h1 { font-size: 17px; margin: 0 auto 0 0; font-weight: 700; }

  button { font: inherit; font-weight: 700; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }

  button:disabled { opacity: .4; cursor: default; }

  #esegui { background: var(--ok); color: #0b2b24; }

  #stop { background: transparent; color: var(--errore); border: 1px solid var(--errore); }

  .stato { color: var(--tenue); font-size: 14px; min-width: 90px; text-align: right; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1.2fr) minmax(0, 1fr); }

  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: minmax(0, .8fr) 1fr 1fr; } }

  #missioni { min-height: 0; overflow: auto; border-right: 1px solid var(--bordo); }

  #missioni > h2 { font-size: 15px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--bordo); }

  details { border-bottom: 1px solid var(--bordo); }

  summary { cursor: pointer; padding: 12px 16px; font-weight: 700; list-style: none; }

  summary::-webkit-details-marker { display: none; }

  summary::before { content: "\25B8"; display: inline-block; width: 1.2em; color: var(--tenue); transition: transform .15s; }

  details[open] > summary::before { transform: rotate(90deg); }

  summary:focus-visible { outline: 2px solid var(--ok); outline-offset: -2px; }

  @media (prefers-reduced-motion: reduce) { summary::before { transition: none; } }

  .corpo { padding: 0 16px 16px; font-size: 14px; line-height: 1.5; }

  .corpo p { margin: 0 0 8px; }

  .corpo .meta { color: var(--tenue); }

  .corpo .avviso { color: var(--suggerimento); }

  .passo { margin-top: 10px; }

  .passo strong { display: block; color: var(--ok); }

  .azioni { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

  .azioni .prova { background: var(--ok); color: #0b2b24; }

  .azioni .alt { background: transparent; color: var(--suggerimento); border: 1px solid var(--suggerimento); }

  #editor { min-height: 0; overflow: auto; border-right: 1px solid var(--bordo); }

  #editor .cm-editor { height: 100%; font-family: var(--mono); font-size: 15px; }

  #editor textarea { width: 100%; height: 100%; background: var(--pannello); color: var(--testo); border: 0; padding: 14px; font-family: var(--mono); font-size: 15px; resize: none; tab-size: 4; }

  #destra { display: flex; flex-direction: column; min-height: 0; }

  #output { flex: 1; margin: 0; padding: 14px; overflow: auto; background: var(--pannello); font-family: var(--mono); font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

  #output .err { color: var(--errore); }

  #output .eco { color: var(--ok); }

  #riga-input { display: none; gap: 8px; padding: 8px 14px; background: var(--pannello); border-top: 1px solid var(--bordo); }

  #riga-input.attiva { display: flex; }

  #riga-input input { flex: 1; background: var(--sfondo); color: var(--testo); border: 1px solid var(--bordo); border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 14px; }

  #riga-input button { background: var(--bordo); color: var(--testo); }

  #spiega { display: none; padding: 14px 16px; border-top: 3px solid var(--errore); background: var(--sfondo); max-height: 40%; overflow: auto; line-height: 1.5; }

  #spiega.attiva { display: block; }

  #spiega.neutro { border-top-color: var(--tenue); }

  #spiega h2 { font-size: 15px; margin: 0 0 6px; }

  #spiega .riga { font-family: var(--mono); font-size: 13px; color: var(--tenue); margin-bottom: 8px; }

  #spiega .sug { color: var(--suggerimento); margin: 8px 0 0; }

  #spiega p { margin: 0; max-width: 62ch; }

  #missioni h2.gruppo { border-top: 1px solid var(--bordo); margin-top: 8px; }

  .corpo ul { margin: 4px 0 10px; padding-left: 18px; }

  .corpo > strong { display: block; margin-top: 10px; color: var(--ok); }

  .azioni .controlla { background: var(--suggerimento); color: #2b2100; }

  .esiti { margin-top: 12px; }

  .esiti .riepilogo { font-weight: 700; margin: 0 0 6px; }

  .esiti ul { list-style: none; padding: 0; margin: 0; }

  .esiti li { margin: 6px 0; }

  .esiti li.ok { color: var(--ok); }

  .esiti li.ko { color: var(--errore); }

  .esiti pre.dettaglio { margin: 4px 0 0; padding: 8px 10px; background: var(--pannello); border-radius: 6px; color: var(--testo); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }

</style>

</head>

<body>

<header>

  <h1>Officina</h1>

  <span class="stato" id="stato">pronto</span>

  <button id="stop" disabled>Stop</button>

  <button id="esegui" title="Ctrl+Invio">Esegui</button>

</header>

<main>

  <aside id="missioni"><h2>Missioni</h2><div id="elenco-missioni"></div></aside>

  <div id="editor"></div>

  <div id="destra">

    <pre id="output" aria-live="polite"></pre>

    <form id="riga-input"><input id="testo-input" autocomplete="off" aria-label="Risposta al programma"><button>Invia</button></form>

    <section id="spiega" aria-live="polite"></section>

  </div>

</main>



<script type="module">

const INIZIALE = `nome = input("Come ti chiami? ")

print("Ciao", nome)

`;



// ---------- Editor: CodeMirror 6 se riesce a caricarsi, altrimenti textarea ----------

let editor;

const contenitore = document.getElementById("editor");

async function creaEditor() {

  try {

    const [{ basicSetup, EditorView }, { python }, { oneDark }] = await Promise.all([

      import("https://esm.sh/codemirror@6.0.1"),

      import("https://esm.sh/@codemirror/lang-python@6.1.6"),

      import("https://esm.sh/@codemirror/theme-one-dark@6.1.2"),

    ]);

    const view = new EditorView({ doc: INIZIALE, extensions: [basicSetup, python(), oneDark], parent: contenitore });

    return {

      get: () => view.state.doc.toString(),

      set: (t) => view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: t } }),

    };

  } catch (e) {

    const ta = document.createElement("textarea");

    ta.value = INIZIALE; ta.spellcheck = false;

    ta.addEventListener("keydown", (ev) => {

      if (ev.key === "Tab") { ev.preventDefault(); document.execCommand("insertText", false, "    "); }

    });

    contenitore.append(ta);

    return { get: () => ta.value, set: (t) => (ta.value = t) };

  }

}



// ---------- Connessione al runner ----------

const $ = (id) => document.getElementById(id);

const out = $("output"), spiega = $("spiega"), stato = $("stato");

let ws, inEsecuzione = false;

let pulito = ""; // ultimo codice eseguito o caricato: serve a non perdere modifiche



function imposta(esecuzione) {

  inEsecuzione = esecuzione;

  $("esegui").disabled = esecuzione;

  $("stop").disabled = !esecuzione;

  document.querySelectorAll(".carica").forEach((b) => (b.disabled = esecuzione));

  $("riga-input").classList.toggle("attiva", esecuzione);

  stato.textContent = esecuzione ? "in esecuzione…" : "pronto";

  if (esecuzione) $("testo-input").focus();

}



function scrivi(testo, classe) {

  const s = document.createElement("span");

  if (classe) s.className = classe;

  s.textContent = testo;

  out.append(s);

  out.scrollTop = out.scrollHeight;

}



function mostraSpiegazione(e) {

  spiega.replaceChildren();

  if (!e) { spiega.classList.remove("attiva"); return; }

  const neutro = e.tipo === "stop";

  spiega.classList.toggle("neutro", neutro);

  const h = document.createElement("h2");

  h.textContent = neutro ? "Programma fermato" : "Cosa è successo";

  spiega.append(h);

  if (e.riga) {

    const r = document.createElement("div");

    r.className = "riga";

    r.textContent = `Riga ${e.riga}` + (e.testo_riga ? `:  ${e.testo_riga}` : "");

    spiega.append(r);

  }

  const p = document.createElement("p"); p.textContent = e.spiegazione; spiega.append(p);

  if (e.suggerimento) {

    const s = document.createElement("p"); s.className = "sug";

    s.textContent = "Prova così: " + e.suggerimento; spiega.append(s);

  }

  spiega.classList.add("attiva");

}



function connetti() {

  ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onmessage = (ev) => {

    const m = JSON.parse(ev.data);

    if (m.t === "out") scrivi(m.testo);

    else if (m.t === "err") scrivi(m.testo, "err");

    else if (m.t === "fine") { imposta(false); mostraSpiegazione(m.errore); }

  };

  ws.onclose = () => { imposta(false); stato.textContent = "scollegato"; setTimeout(connetti, 1000); };

}



function el(tag, classe, testo) {

  const e = document.createElement(tag);

  if (classe) e.className = classe;

  if (testo) e.textContent = testo;

  return e;

}



function carica(codice) {

  if (inEsecuzione) return;

  if (editor.get() !== pulito && !confirm("Hai modificato il codice nell'editor. Vuoi sostituirlo?")) return;

  editor.set(codice);

  pulito = codice;

  out.replaceChildren();

  mostraSpiegazione(null);

  stato.textContent = "codice caricato";

}



const sfideStato = {};   // id sfida -> {tentativi, ultimo, ha_codice}



function testoStato(st) {

  if (!st || !st.tentativi) return "Nessun tentativo ancora.";

  const u = st.ultimo;

  return `Tentativi: ${st.tentativi}. Ultimo: ${u.ok_base}/${u.tot_base} prove base` +

    (u.tot_extra ? `, ${u.ok_extra}/${u.tot_extra} extra` : "") + ".";

}



async function aggiornaStatoSfide() {

  try { Object.assign(sfideStato, await (await fetch("/sfide/stato")).json()); } catch (e) { /* nessuno storico */ }

  document.querySelectorAll("[data-stato]").forEach((p) => { p.textContent = testoStato(sfideStato[p.dataset.stato]); });

  document.querySelectorAll("[data-riprendi]").forEach((b) => {

    const st = sfideStato[b.dataset.riprendi];

    b.hidden = !(st && st.ha_codice);

  });

}



function mostraEsiti(area, d) {

  area.replaceChildren();

  const tuttoBase = d.ok_base === d.tot_base;

  area.append(el("p", "riepilogo", `Prove base: ${d.ok_base}/${d.tot_base}` + (d.tot_extra ? `, extra: ${d.ok_extra}/${d.tot_extra}` : "")));

  area.append(el("p", "", tuttoBase

    ? "Tutte le prove base sono superate. Ora prova gli extra, e poi spiega a voce come hai ragionato."

    : "Leggi le prove che non passano: dicono cosa si aspettava il computer. Correggi e ricontrolla."));

  const ul = el("ul");

  d.risultati.forEach((r) => {

    const li = el("li", r.ok ? "ok" : "ko", `${r.ok ? "✓" : "✗"} ${r.extra ? "Extra: " : ""}${r.titolo}`);

    if (r.dettaglio) li.append(el("pre", "dettaglio", r.dettaglio));

    ul.append(li);

  });

  area.append(ul);

}



async function controlla(m, area, bottone) {

  if (inEsecuzione) return;

  bottone.disabled = true;

  area.replaceChildren(el("p", "meta", "Controllo in corso…"));

  try {

    const r = await fetch("/verifica", { method: "POST", headers: { "Content-Type": "application/json" },

                                          body: JSON.stringify({ id: m.id, codice: editor.get() }) });

    const d = await r.json();

    if (!r.ok) throw new Error(d.detail || "errore del server");

    pulito = editor.get();   // il codice è stato salvato insieme al tentativo

    mostraEsiti(area, d);

  } catch (e) {

    area.replaceChildren(el("p", "avviso", "Non riesco a controllare: " + e.message));

  }

  bottone.disabled = false;

  aggiornaStatoSfide();

}



function aggiungiPassi(corpo, m) {

  m.passi.forEach((p) => {

    const passo = el("div", "passo");

    passo.append(el("strong", "", p.nome), el("span", "", p.testo));

    corpo.append(passo);

  });

}



function creaMissione(m, n) {

  const d = el("details");

  d.name = "missione"; // aprendone una si chiude l'altra

  d.append(el("summary", "", `Missione ${n}: ${m.titolo}`));

  const corpo = el("div", "corpo");

  corpo.append(el("p", "meta", "Concetti: " + m.concetti));

  corpo.append(el("p", "", m.risultato));

  if (m.nota) corpo.append(el("p", "avviso", m.nota));

  aggiungiPassi(corpo, m);

  const azioni = el("div", "azioni");

  if (m.partenza) {

    const b = el("button", "carica prova", "Prova");

    b.type = "button"; b.onclick = () => carica(m.partenza);

    azioni.append(b);

  }

  if (m.rotto) {

    const b = el("button", "carica alt", "Carica versione da riparare");

    b.type = "button"; b.onclick = () => carica(m.rotto);

    azioni.append(b);

  }

  corpo.append(azioni);

  d.append(corpo);

  return d;

}



function creaSfida(m, n) {

  const d = el("details");

  d.name = "missione";

  d.append(el("summary", "", `Sfida ${n}: ${m.titolo}`));

  const corpo = el("div", "corpo");

  corpo.append(el("p", "meta", "Concetti: " + m.concetti));

  corpo.append(el("p", "", m.enunciato));

  if (m.nota) corpo.append(el("p", "avviso", m.nota));

  corpo.append(el("strong", "", "Cosa deve fare"));

  const req = el("ul");

  m.requisiti.forEach((r) => req.append(el("li", "", r)));

  corpo.append(req);

  corpo.append(el("strong", "", "Cosa verrà provato"));

  const prove = el("ul");

  m.prove_pubbliche.forEach((p) => prove.append(el("li", "", (p.extra ? "Extra: " : "") + p.titolo)));

  if (m.prove_nascoste) prove.append(el("li", "", `più ${m.prove_nascoste} prove nascoste`));

  corpo.append(prove);

  aggiungiPassi(corpo, m);

  const stato = el("p", "meta", testoStato(sfideStato[m.id]));

  stato.dataset.stato = m.id;

  corpo.append(stato);



  const esiti = el("div", "esiti");

  const azioni = el("div", "azioni");

  const inizia = el("button", "carica prova", "Inizia");

  inizia.type = "button";

  inizia.onclick = () => {

    const st = sfideStato[m.id];

    if (st && st.ha_codice && !confirm("Hai già un tentativo salvato per questa sfida. Vuoi ricominciare dal modello? Il tentativo salvato resta finché non premi Controlla.")) return;

    carica(m.modello);

  };

  const riprendi = el("button", "carica alt", "Riprendi il mio codice");

  riprendi.type = "button"; riprendi.hidden = true; riprendi.dataset.riprendi = m.id;

  riprendi.onclick = async () => {

    try { carica((await (await fetch(`/sfide/${encodeURIComponent(m.id)}/codice`)).json()).codice); }

    catch (e) { stato.textContent = "Non riesco a recuperare il codice salvato."; }

  };

  const verifica = el("button", "controlla", "Controlla");

  verifica.type = "button";

  verifica.onclick = () => controlla(m, esiti, verifica);

  azioni.append(inizia, riprendi, verifica);

  corpo.append(azioni, esiti);

  d.append(corpo);

  return d;

}



function creaMissioni(lista) {

  const box = $("elenco-missioni");

  box.replaceChildren();

  if (!lista.length) { box.append(el("p", "corpo meta", "Nessuna missione trovata.")); return; }

  lista.filter((m) => m.tipo !== "sfida").forEach((m, i) => box.append(creaMissione(m, i + 1)));

  let gruppo = null;   // le sfide sono numerate di seguito, con un titolo ogni volta che cambia il gruppo

  lista.filter((m) => m.tipo === "sfida").forEach((m, i) => {

    const g = m.gruppo || "Sfide: scrivi tu il codice";

    if (g !== gruppo) { box.append(el("h2", "gruppo", g)); gruppo = g; }

    box.append(creaSfida(m, i + 1));

  });

}



function esegui() {

  if (inEsecuzione || ws.readyState !== 1) return;

  pulito = editor.get();

  out.replaceChildren(); mostraSpiegazione(null);

  imposta(true);

  ws.send(JSON.stringify({ t: "esegui", codice: editor.get() }));

}



$("esegui").onclick = esegui;

$("stop").onclick = () => ws.send(JSON.stringify({ t: "stop" }));

$("riga-input").onsubmit = (ev) => {

  ev.preventDefault();

  const campo = $("testo-input");

  scrivi(campo.value + "\n", "eco");

  ws.send(JSON.stringify({ t: "stdin", testo: campo.value }));

  campo.value = "";

};

document.addEventListener("keydown", (ev) => {

  if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") { ev.preventDefault(); esegui(); }

});



editor = await creaEditor();

const salvato = await (await fetch("/codice")).json();

if (salvato.codice) editor.set(salvato.codice);

pulito = editor.get();

connetti();

try {

  creaMissioni(await (await fetch("/missioni")).json());

  await aggiornaStatoSfide();

} catch (e) {

  $("elenco-missioni").append(el("p", "corpo meta", "Missioni non disponibili."));

}

</script>

</body>

</html>
